# D&D Companion local DNS for the 192.168.1.0/24 LAN.
port=53
interface=enp5s0
listen-address=192.168.1.5
bind-interfaces

# Resolve the local application name and every subdomain to this host.
address=/dndcompanion.pl/192.168.1.5
local=/dndcompanion.pl/

# Forward every other query to the LAN router.
no-resolv
server=192.168.1.1

# Resolver safety and cache.
domain-needed
bogus-priv
stop-dns-rebind
rebind-domain-ok=/dndcompanion.pl/
cache-size=1000
no-hosts
