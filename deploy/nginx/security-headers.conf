# Include in the server/location serving the PWA HTML (not only the API).
# GitHub Pages does not support custom response headers; use a proxy/hosting
# provider with header support for browser-enforced protection from framing.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://dndcompanion-api.onrender.com; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
