name: Resolve release dependency lock

on:
  pull_request:
    paths:
      - package.json
      - server/package.json
      - .github/workflows/prepare-release-lock.yml

permissions:
  contents: read

jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/1.6.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Export lockfile for local verification
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';
          const encoded = gzipSync(readFileSync('package-lock.json')).toString('base64');
          console.log('DND_LOCK_BASE64_BEGIN');
          for (let index=0; index<encoded.length; index+=4000) console.log(encoded.slice(index,index+4000));
          console.log('DND_LOCK_BASE64_END');
          JS
      - run: npm audit
